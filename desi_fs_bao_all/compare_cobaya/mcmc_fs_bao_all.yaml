theory:
  camb:
    extra_args:
      bbn_predictor: PArthENoPE_880.2_standard.dat
      dark_energy_model: ppf
      num_massive_neutrinos: 1
      AccuracyBoost: 3
      lAccuracyBoost: 3
      lSampleBoost: 3
    speed: 2

  fs_bao_likelihoods.reptvelocileptors:
    python_path: /Users/zhiyulu/Documents/Science/Cosmology_packages/LSS/desi-kp-cosmological-likelihoods-main/dr1

likelihood:
  fs_bao_likelihoods.desi_fs_bao_all:
    python_path: /Users/zhiyulu/Documents/Science/Cosmology_packages/LSS/desi-kp-cosmological-likelihoods-main/dr1
    data_dir: /Users/zhiyulu/Documents/Science/Cosmology_packages/LSS/desi-kp-cosmological-likelihoods-main/dr1/fs_bao_likelihoods/data/likelihood

params:
  # Fixed cosmological parameters
  H0: 68.5
  omegam: 0.304158
  ombh2: 0.0189629
  logA: 3.0
  ns: 0.96
  mnu: 0.06

  # Cosmological parameters computed from the fixed inputs
  omch2:
    value: "lambda omegam, ombh2, H0: omegam*(H0/100)**2 - ombh2"
    latex: \Omega_\mathrm{c} h^2

  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}

  # The nuisance parameters are intentionally not listed here.
  # Their priors are loaded from desi_fs_bao_all.yaml, so Cobaya samples:
  #
  # pre_QSO_z0.{b1p,b2p,bsp}
  # pre_ELG_z1.{b1p,b2p,bsp}
  # pre_LRG_z2.{b1p,b2p,bsp}
  # pre_LRG_z1.{b1p,b2p,bsp}
  # pre_LRG_z0.{b1p,b2p,bsp}
  # pre_BGS_z0.{b1p,b2p,bsp}

sampler:
  mcmc:
    covmat: chain.covmat
    learn_proposal: true
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    max_tries: 10000

output: chains_fs_bao_all/chain

stop_at_error: true